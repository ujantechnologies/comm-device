name: ci

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn joblib
      - name: Compile
        run: python -m compileall comm_device scripts
      - name: Environment script smoke test
        run: python scripts/check_env.py || true
